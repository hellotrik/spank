version: 2

before:
  hooks:
    - go mod tidy
    # Windows PE icon: COFF resource consumed by the linker for GOOS=windows (see rsrc_windows_amd64.syso).
    - go run github.com/akavel/rsrc@v0.10.2 -ico doc/icon.ico -o rsrc_windows_amd64.syso -arch amd64

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
    goarch:
      - arm64
      - amd64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        # macOS .app bundle + AppIcon.icns (requires macOS builder: sips, iconutil).
        - sh -c 'test "{{ .Os }}" != "darwin" || bash packaging/macos/bundle.sh "{{ .Path }}" "{{ .Version }}"'

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: taigrr
    name: spank
